services:

  db:
    image: mysql:8.0
    container_name: xianfoodbar-db-1
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wordpress
      MYSQL_PASSWORD: wordpress
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 5s
      timeout: 5s
      retries: 10

  wordpress:
    image: wordpress:php8.1-apache
    container_name: xianfoodbar-wordpress-1
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_TABLE_PREFIX: wp_
      WORDPRESS_DEBUG: "1"
    volumes:
      - ./mytheme:/var/www/html/wp-content/themes/mytheme
      - wp_core:/var/www/html
      - wp_uploads:/var/www/html/wp-content/uploads
      - ./plugins:/var/www/html/wp-content/plugins
    # Runs as root: fixes write permissions on theme subdirs, then hands off to
    # the original WP entrypoint (which generates wp-config.php and starts Apache).
    entrypoint: >
      bash -c "
        chmod -R 777 /var/www/html/wp-content/themes/mytheme/var &&
        chmod -R 777 /var/www/html/wp-content/themes/mytheme/public/build &&
        mkdir -p /var/www/html/wp-content/themes/mytheme/public/upload &&
        chmod -R 777 /var/www/html/wp-content/themes/mytheme/public/upload &&
        chmod 777 /var/www/html/wp-content/themes/mytheme &&
        chmod 777 /var/www/html/wp-content/themes/mytheme/src &&
        mkdir -p /var/www/html/wp-content/uploads &&
        chown -R www-data:www-data /var/www/html/wp-content/uploads &&
        chmod -R 755 /var/www/html/wp-content/uploads &&
        chown -R www-data:www-data /var/www/html/wp-content/plugins &&
        chmod -R 755 /var/www/html/wp-content/plugins &&
        exec docker-entrypoint.sh apache2-foreground
      "

  shop-db:
    image: mysql:8.0
    container_name: xianfoodbar-shop-db-1
    volumes:
      - shop_db_data:/var/lib/mysql
      - ./shop/mysql/custom.cnf:/etc/mysql/conf.d/custom.cnf
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootwordpress
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wordpress
      MYSQL_PASSWORD: wordpress
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 1m30s
      timeout: 30s
      retries: 5
      start_period: 30s

  shop-wordpress:
    depends_on:
      shop-db:
        condition: service_healthy
    image: wordpress:php8.1-apache
    container_name: xianfoodbar-shop-wordpress-1
    ports:
      - 8081:80
    restart: unless-stopped
    volumes:
      - shop_wordpress_core:/var/www/html
      - ./shop/.plugins:/var/www/html/wp-content/plugins
      - ./shop/.themes:/var/www/html/wp-content/themes
    environment:
      WORDPRESS_DB_HOST: shop-db:3306
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
    entrypoint: >
      bash -c "
        chown -R www-data:www-data /var/www/html &&
        exec docker-entrypoint.sh apache2-foreground
      "

volumes:
  db_data:
  wp_core:
  wp_uploads:
  shop_db_data:
    external: true
    name: xianfoodbar-shop_db_data
  shop_wordpress_core:
    external: true
    name: xianfoodbar-shop_wordpress_core
