services:

  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wordpress
      MYSQL_PASSWORD: wordpress
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 5s
      timeout: 5s
      retries: 10

  wordpress:
    build:
      context: .
      args:
        VERSION: ${VERSION:-1.0.0}
    image: xianfoodbar-wordpress:${VERSION:-1.0.0}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_TABLE_PREFIX: wp_
      WORDPRESS_DEBUG: "1"
    volumes:
      - ./mytheme:/var/www/html/wp-content/themes/mytheme
      - wp_core:/var/www/html
      - wp_uploads:/var/www/html/wp-content/uploads
      - ./plugins:/var/www/html/wp-content/plugins
    # Runs as root: fixes write permissions on theme subdirs, then hands off to
    # the original WP entrypoint (which generates wp-config.php and starts Apache).
    entrypoint: >
      bash -c "
        chmod -R 777 /var/www/html/wp-content/themes/mytheme/var &&
        chmod -R 777 /var/www/html/wp-content/themes/mytheme/public/build &&
        mkdir -p /var/www/html/wp-content/themes/mytheme/public/upload &&
        chmod -R 777 /var/www/html/wp-content/themes/mytheme/public/upload &&
        chmod 777 /var/www/html/wp-content/themes/mytheme &&
        chmod 777 /var/www/html/wp-content/themes/mytheme/src &&
        mkdir -p /var/www/html/wp-content/uploads &&
        chown -R www-data:www-data /var/www/html/wp-content/uploads &&
        chmod -R 755 /var/www/html/wp-content/uploads &&
        chown -R www-data:www-data /var/www/html/wp-content/plugins &&
        chmod -R 755 /var/www/html/wp-content/plugins &&
        exec docker-entrypoint.sh apache2-foreground
      "

volumes:
  db_data:
  wp_core:
  wp_uploads:
